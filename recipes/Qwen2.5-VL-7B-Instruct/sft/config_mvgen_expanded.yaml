# MVGen Expanded Dataset Training Configuration
# ==============================================
# Training with 96,000 samples (24,000 × 4 views)
# Each view is a separate training sample with pre-transformed CoT
#
# Base: Qwen2.5-VL-7B-Instruct (fresh start to maximize learning)

# Model arguments
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
dataset_name: local
data_dir: /data/SpatialReasoner/data/openimages/
num_processes: 4

# MVGen settings - use expanded 96k dataset
mvgen_enabled: true
mvgen_data_dir: /data/SpatialReasoner/data/mvgen_augmented/
mvgen_dataset_file: augmented_dataset_expanded.json
mvgen_mode: single
view_selection: random  # Each sample has only one view, random will pick it

# CoT settings - already pre-transformed in dataset
cot_augmentation_enabled: false

# SFT trainer config
dataset_text_field: ""
dataset_kwargs:
  skip_prepare_dataset: true
remove_unused_columns: false
bf16: true
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 2.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
log_level: info
logging_steps: 50
logging_strategy: steps
log_completions: true
max_length: 2048
min_pixels: 59716
max_pixels: 200704
max_steps: -1
num_train_epochs: 1  # 96k samples, 1 epoch is sufficient
output_dir: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-MVGen-96k
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to:
  - wandb
save_strategy: steps
save_steps: 1000
eval_strategy: "no"
seed: 42

# WandB settings
wandb_project: spatial-reasoner-mvgen-96k
wandb_entity: null

load_best_model_at_end: false
