# Augmented HuggingFace Dataset Training Configuration
# Uses daeyeeeeeon/SpatialReasonerTrain-RL-m10_cw and p10_ccw datasets
# With dynamic CoT coordinate transformation

# Model arguments
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments - HuggingFace datasets
dataset_name: daeyeeeeeon/SpatialReasonerTrain-RL-m10_cw+daeyeeeeeon/SpatialReasonerTrain-RL-p10_ccw
dataset_test_split: train
dataset_train_split: train
dataset_configs:
- all
data_dir: /data/SpatialReasoner/data/openimages/
num_processes: 4

# Augmentation settings
augmented_cot_transform: true  # Enable CoT coordinate transformation

# SFT trainer config
dataset_text_field: ""
dataset_kwargs:
  skip_prepare_dataset: true
remove_unused_columns: false
bf16: true
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
log_level: info
logging_steps: 10
logging_strategy: steps
log_completions: true
max_length: 2048

# Image processing - FIXED resolution
min_pixels: 100352
max_pixels: 100352

# Dataloader optimization
dataloader_num_workers: 4
dataloader_prefetch_factor: 2
dataloader_persistent_workers: true
dataloader_pin_memory: true
max_steps: -1
num_train_epochs: 10
output_dir: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-Augmented
overwrite_output_dir: true
per_device_train_batch_size: 4
push_to_hub: false
report_to:
- wandb
save_strategy: steps
save_steps: 200
seed: 42
stop_steps: 3000

# WandB settings
wandb_project: spatial-reasoner-augmented
wandb_entity: null
