# MVGen Single-View Training Configuration
# =========================================
# Training with MVGen-augmented data, using one randomly selected view per sample.
# This configuration emphasizes view diversity through random selection.
#
# Data Format:
#   Each sample has 50-100 pre-generated views from MVGenMaster.
#   During training, one view is randomly selected per sample per epoch.
#   The CoT answer is augmented to reflect the viewing angle.
#
# Usage:
#   accelerate launch --config_file recipes/accelerate_configs/zero2.yaml \
#     src/spatial_reasoner/sft_multiview.py \
#     --config recipes/Qwen2.5-VL-7B-Instruct/sft/config_mvgen_single.yaml

# Model arguments
# Using SFT-v2 checkpoint as base (58% accuracy on 3DSRBench)
model_name_or_path: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-v2
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
# Use local augmented dataset or HuggingFace
dataset_name: local  # Set to local to use mvgen_data_dir
dataset_test_split: val
dataset_configs:
  - all
data_dir: /data/SpatialReasoner/data/openimages/
llava_dir: /data/SpatialReasoner/data/llava/
num_processes: 4

# MVGen augmentation settings
mvgen_enabled: true
mvgen_data_dir: /data/SpatialReasoner/data/mvgen_augmented/  # Directory with augmented_dataset.json
mvgen_mode: single  # single = one view per sample, multi = two views
view_selection: random  # random, fixed_original, fixed_angle
fixed_view_angle: null  # If view_selection is fixed_angle, use this angle

# CoT augmentation settings
cot_augmentation_enabled: true
cot_augmentation_strategy: prefix  # prefix, inline, suffix, full
cot_include_angle: true
cot_angle_precision: 1

# SFT trainer config
dataset_text_field: ""
dataset_kwargs:
  skip_prepare_dataset: true
remove_unused_columns: false
bf16: true
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 3.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.1
log_level: info
logging_steps: 10
logging_strategy: steps
log_completions: true
max_length: 2048
min_pixels: 59716
max_pixels: 200704
max_steps: -1
num_train_epochs: 3
output_dir: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-MVGen-Single
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to:
  - wandb
save_strategy: steps
save_steps: 500
eval_strategy: "no"
# eval_steps: 500
seed: 42
stop_steps: 5000

# WandB settings
wandb_project: spatial-reasoner-mvgen
wandb_entity: null  # Set your WandB entity
wandb_api_key: 2f4e627868f1f9dad10bcb1a14fbf96817e6baa9

# Early stopping (disabled without eval dataset)
load_best_model_at_end: false
# metric_for_best_model: eval_loss
# greater_is_better: false
