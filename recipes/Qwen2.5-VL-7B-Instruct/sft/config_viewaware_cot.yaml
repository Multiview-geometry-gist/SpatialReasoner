# View-Aware CoT Training Configuration
# =====================================
# Training with view-aware CoT that includes explicit viewpoint context.
# Adds viewpoint prefix to CoT for better multi-view understanding.
#
# Key Features:
#   - Viewpoint-aware prefix: "[From +10° viewpoint]" or "[From -10° viewpoint]"
#   - Coordinate transformation using rotated bounding_box/direction
#   - High-resolution HF augmented images (576×320)
#   - Fine-tunes from SFT-v2 checkpoint
#
# Usage (GPU 4-7):
#   CUDA_VISIBLE_DEVICES=4,5,6,7 accelerate launch \
#     --config_file recipes/accelerate_configs/zero2_4gpu_4567.yaml \
#     src/spatial_reasoner/sft_viewaware_cot.py \
#     --config recipes/Qwen2.5-VL-7B-Instruct/sft/config_viewaware_cot.yaml

# Model arguments
# Fine-tune from SFT-v2 (58% accuracy) to preserve learned spatial reasoning
model_name_or_path: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-v2
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
# Use HuggingFace augmented datasets with rotated coordinates
dataset_name: daeyeeeeeon/SpatialReasonerTrain-RL-p10_ccw+daeyeeeeeon/SpatialReasonerTrain-RL-m10_cw
dataset_train_split: train
data_dir: /data/SpatialReasoner/data/openimages/
hf_augmented_data_dir: /data/SpatialReasoner/data/hf_augmented
num_processes: 4

# View-aware CoT settings
augmented_cot_transform: true
viewpoint_aware_prefix: true  # Add explicit viewpoint context to CoT

# SFT trainer config
dataset_text_field: ""
dataset_kwargs:
  skip_prepare_dataset: true
remove_unused_columns: false
bf16: true
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 2.0e-06
lr_scheduler_type: cosine
warmup_ratio: 0.15
log_level: info
logging_steps: 10
logging_strategy: steps
log_completions: true
max_length: 2560  # Slightly increased for view-aware prefix
min_pixels: 59716
max_pixels: 100352
max_steps: -1
num_train_epochs: 3
output_dir: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-ViewAware-CoT
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to:
  - wandb
save_strategy: steps
save_steps: 200
eval_strategy: "no"
seed: 42

# WandB settings
wandb_project: spatial-reasoner-viewaware-cot
wandb_entity: null

load_best_model_at_end: false
