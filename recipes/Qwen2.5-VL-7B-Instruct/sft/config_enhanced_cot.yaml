# Enhanced CoT Training Configuration
# ====================================
# Training with category-specific Chain-of-Thought reasoning templates.
# This approach extends HF-Augmented by generating more detailed,
# mathematically grounded CoT for each question category.
#
# Key Features:
#   - Category-specific CoT templates with explicit geometric reasoning
#   - Uses rotated coordinates from HF datasets (bounding_box, direction)
#   - Maintains high-resolution images (no MVGen resolution issues)
#   - Fine-tunes from SFT-v2 checkpoint for best results
#
# Usage:
#   accelerate launch --config_file recipes/accelerate_configs/zero2.yaml \
#     src/spatial_reasoner/sft_enhanced_cot.py \
#     --config recipes/Qwen2.5-VL-7B-Instruct/sft/config_enhanced_cot.yaml

# Model arguments
# Fine-tune from SFT-v2 (58% accuracy) to preserve learned spatial reasoning
model_name_or_path: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-v2
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

# Data training arguments
# Use HuggingFace augmented datasets with rotated coordinates
dataset_name: daeyeeeeeon/SpatialReasonerTrain-RL-p10_ccw+daeyeeeeeon/SpatialReasonerTrain-RL-m10_cw
dataset_train_split: train
data_dir: /data/SpatialReasoner/data/openimages/
hf_augmented_data_dir: /data/SpatialReasoner/data/hf_augmented
num_processes: 4

# Enhanced CoT settings
use_enhanced_cot: true  # Use category-specific CoT templates

# SFT trainer config
dataset_text_field: ""
dataset_kwargs:
  skip_prepare_dataset: true
remove_unused_columns: false
bf16: true
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-06  # Lower LR for enhanced CoT (more complex patterns)
lr_scheduler_type: cosine
warmup_ratio: 0.15
log_level: info
logging_steps: 10
logging_strategy: steps
log_completions: true
max_length: 3072  # Increased for longer enhanced CoT
min_pixels: 59716
max_pixels: 100352
max_steps: -1
num_train_epochs: 3
output_dir: /data/SpatialReasoner/checkpoints/Qwen2.5-VL-7B-SFT-EnhancedCoT
overwrite_output_dir: true
per_device_train_batch_size: 1
push_to_hub: false
report_to:
  - wandb
save_strategy: steps
save_steps: 200
eval_strategy: "no"
seed: 42

# WandB settings
wandb_project: spatial-reasoner-enhanced-cot
wandb_entity: null

load_best_model_at_end: false
